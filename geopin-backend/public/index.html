<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPin Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .login-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { margin-bottom: 1.5rem; color: #333; }
        button { background-color: #4285F4; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #357ae8; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>GeoPin System</h1>
        <p>Manage your location pins securely.</p>
        <br>
        <button id="google-login">Sign in with Google</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
        // We wrap everything in an 'async' function so we can wait for the keys
        async function initializeApp() {
            try {
                // 1. Ask the backend for the keys
                const response = await fetch('/api/config');
                const config = await response.json();

                // 2. Initialize Supabase with the keys we just got
                const supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);

                // 3. Setup the Login Button
                document.getElementById('google-login').addEventListener('click', async () => {
                    const { data, error } = await supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            // Automatically determine the current URL (localhost:3000)
                            redirectTo: window.location.origin + '/dashboard.html' 
                        }
                    });

                    if (error) alert('Error logging in: ' + error.message);
                });

            } catch (error) {
                console.error("Could not load config:", error);
                alert("Error connecting to server.");
            }
        }

        // Start the app
        initializeApp();
    </script>
</body>
</html>
